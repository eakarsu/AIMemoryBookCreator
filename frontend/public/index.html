<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="AI Memory Book Creator - Preserve your precious memories with AI" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>AI Memory Book Creator</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function(){
        var FROM = 'http://localhost:3001';
        var TO = 'http://localhost:4501';
        var _fetch = window.fetch;
        window.fetch = function(input, init){
          if (typeof input === 'string' && input.indexOf(FROM) === 0) input = TO + input.slice(FROM.length);
          else if (input && input.url && input.url.indexOf(FROM) === 0) input = new Request(TO + input.url.slice(FROM.length), input);
          return _fetch(input, init);
        };
        var _open = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(m, u){
          if (typeof u === 'string' && u.indexOf(FROM) === 0) u = TO + u.slice(FROM.length);
          arguments[1] = u;
          return _open.apply(this, arguments);
        };
      })();
    </script>
  </body>
</html>
